{% extends "base.html" %}

{% block content %}

<div class="payment-container">

<h2 class="text-center">Payment Gateway</h2>

<hr>

<p class="text-center amount">
Amount to Pay: <strong>₹{{ amount }}</strong>
</p>

<form method="POST">

{% csrf_token %}

<h5>Select Payment Method</h5>

<div class="payment-methods">

<label>
<input type="radio" name="method" value="UPI" onclick="showUPI()"> UPI
</label>

<label>
<input type="radio" name="method" value="Card" onclick="showCard()"> Credit / Debit Card
</label>

<label>
<input type="radio" name="method" value="NetBanking" onclick="showBank()"> Net Banking
</label>

</div>

<br>

<!-- UPI -->

<div id="upi_section" class="payment-section">

<label>UPI ID</label>
<input type="text" name="upi_id" class="form-control" placeholder="example@upi">

</div>

<!-- Card -->

<div id="card_section" class="payment-section">

<label>Card Number</label>
<input type="text" name="card_number" class="form-control">

<label>Expiry</label>
<input type="text" name="expiry" class="form-control">

<label>CVV</label>
<input type="password" name="cvv" class="form-control">

</div>

<!-- Net Banking -->

<div id="bank_section" class="payment-section">

<label>Select Bank</label>

<select name="bank" class="form-control">

<option>SBI</option>
<option>HDFC</option>
<option>ICICI</option>
<option>Axis Bank</option>

</select>

</div>

<br>

<button type="submit" class="btn btn-success w-100">Pay Now</button>

</form>

</div>


<script>

function hideAll(){
document.getElementById("upi_section").style.display="none";
document.getElementById("card_section").style.display="none";
document.getElementById("bank_section").style.display="none";
}

function showUPI(){
hideAll();
document.getElementById("upi_section").style.display="block";
}

function showCard(){
hideAll();
document.getElementById("card_section").style.display="block";
}

function showBank(){
hideAll();
document.getElementById("bank_section").style.display="block";
}

</script>

{% endblock %}
